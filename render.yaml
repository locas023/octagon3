services:
  - type: web
    name: octagon3-workflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: CREATE_DATABASE
        value: "false"
      - key: RUN_MIGRATIONS
        value: "true"
